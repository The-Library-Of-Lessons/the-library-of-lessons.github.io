<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Library of Lessons</title>
<meta name="description" content="A living index of guides — leadership, flow, project work, and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDE2C9;
    --paper-deep: #E3D5B4;
    --ink: #3B2A20;
    --ink-soft: #6B5744;
    --walnut: #2E2018;
    --rust: #9B3D22;
    --rust-deep: #7C3019;
    --brass: #B08B2E;
    --line: rgba(59,42,32,0.16);
    --card-bg: #F6EFDC;
    --shadow: 0 1px 0 rgba(59,42,32,0.08), 0 8px 20px -12px rgba(59,42,32,0.35);
    --radius: 3px;
    --sidebar-w: 300px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(176,139,46,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(155,61,34,0.07), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:"Source Sans 3", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  a{color:inherit;}
  :focus-visible{outline:3px solid var(--rust); outline-offset:2px;}

  /* ---------- Layout shell ---------- */
  .shell{
    display:flex;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--walnut);
    color:#EFE6D3;
    height:100vh;
    position:sticky;
    top:0;
    display:flex;
    flex-direction:column;
    transform:translateX(0);
    transition:transform 0.28s ease, margin-left 0.28s ease;
    border-right:1px solid rgba(0,0,0,0.35);
  }
  .sidebar[data-collapsed="true"]{
    margin-left:calc(-1 * var(--sidebar-w));
  }
  .sidebar-head{
    padding:22px 20px 14px;
    border-bottom:1px solid rgba(239,230,211,0.12);
  }
  .sidebar-head .mark{
    font-family:"Fraunces", serif;
    font-size:1.05rem;
    font-weight:600;
    letter-spacing:0.02em;
  }
  .sidebar-head .sub{
    font-family:"IBM Plex Mono", monospace;
    font-size:0.68rem;
    color:#C7B896;
    text-transform:uppercase;
    letter-spacing:0.12em;
    margin-top:4px;
  }
  .search-wrap{
    padding:14px 16px;
    border-bottom:1px solid rgba(239,230,211,0.12);
  }
  .search-wrap input{
    width:100%;
    background:rgba(239,230,211,0.06);
    border:1px solid rgba(239,230,211,0.22);
    color:#F3EBDA;
    font-family:"Source Sans 3", sans-serif;
    font-size:0.9rem;
    padding:9px 11px;
    border-radius:2px;
  }
  .search-wrap input::placeholder{color:#9E8E71;}
  .search-wrap input:focus-visible{outline:2px solid var(--brass); outline-offset:1px;}

  .sidebar-list{
    list-style:none;
    margin:0;
    padding:8px 8px 20px;
    overflow-y:auto;
    flex:1;
  }
  .sidebar-list li{margin:0;}
  .sidebar-list a{
    display:block;
    padding:9px 12px;
    text-decoration:none;
    color:#DCCFAF;
    font-size:0.86rem;
    border-radius:2px;
    border-left:2px solid transparent;
  }
  .sidebar-list a:hover{
    background:rgba(239,230,211,0.06);
    border-left-color:var(--brass);
    color:#F6EFDC;
  }
  .sidebar-empty{
    padding:14px 16px;
    color:#8E7C60;
    font-size:0.82rem;
    font-style:italic;
  }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    min-width:0;
  }
  .topbar{
    position:sticky;
    top:0;
    z-index:5;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 28px;
    background:linear-gradient(var(--paper) 78%, transparent);
  }
  .toggle-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--card-bg);
    border:1px solid var(--line);
    color:var(--ink);
    padding:8px 12px;
    border-radius:2px;
    cursor:pointer;
    font-family:"IBM Plex Mono", monospace;
    font-size:0.72rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    box-shadow:var(--shadow);
  }
  .toggle-btn:hover{border-color:var(--rust); color:var(--rust-deep);}
  .toggle-btn svg{width:15px; height:15px;}

  .status-line{
    font-family:"IBM Plex Mono", monospace;
    font-size:0.72rem;
    color:var(--ink-soft);
    letter-spacing:0.03em;
  }

  .hero{
    padding:8px 28px 34px;
    max-width:900px;
  }
  .hero .eyebrow{
    font-family:"IBM Plex Mono", monospace;
    font-size:0.72rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--rust-deep);
    margin-bottom:10px;
  }
  .hero h1{
    font-family:"Fraunces", serif;
    font-weight:600;
    font-size:clamp(2.1rem, 4.2vw, 3.4rem);
    line-height:1.05;
    margin:0 0 14px;
    color:var(--walnut);
  }
  .hero p{
    font-size:1.02rem;
    line-height:1.6;
    color:var(--ink-soft);
    max-width:56ch;
    margin:0;
  }

  .grid-wrap{
    padding:6px 28px 60px;
  }

  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:18px;
  }

  .card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:0;
    display:flex;
    text-decoration:none;
    color:var(--ink);
    overflow:hidden;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 2px 0 rgba(59,42,32,0.1), 0 16px 28px -14px rgba(59,42,32,0.45);
  }
  .card .spine{
    width:8px;
    flex-shrink:0;
    background:linear-gradient(180deg, var(--rust), var(--brass));
  }
  .card .body{
    padding:18px 18px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-width:0;
  }
  .card .call-no{
    font-family:"IBM Plex Mono", monospace;
    font-size:0.68rem;
    color:var(--ink-soft);
    letter-spacing:0.06em;
  }
  .card h3{
    font-family:"Fraunces", serif;
    font-weight:600;
    font-size:1.15rem;
    line-height:1.28;
    margin:0;
    color:var(--walnut);
  }
  .card p{
    font-size:0.9rem;
    line-height:1.5;
    color:var(--ink-soft);
    margin:0;
    flex:1;
  }
  .card .open{
    font-family:"IBM Plex Mono", monospace;
    font-size:0.7rem;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--rust-deep);
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:4px;
  }
  .card:hover .open{color:var(--rust);}

  .state-box{
    padding:40px 28px;
    max-width:560px;
    color:var(--ink-soft);
  }
  .state-box .title{
    font-family:"Fraunces", serif;
    font-size:1.3rem;
    color:var(--walnut);
    margin-bottom:8px;
  }
  .skeleton{
    height:150px;
    border-radius:var(--radius);
    background:linear-gradient(100deg, var(--card-bg) 30%, var(--paper-deep) 50%, var(--card-bg) 70%);
    background-size:200% 100%;
    animation:shimmer 1.4s infinite;
    border:1px solid var(--line);
  }
  @keyframes shimmer{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }

  footer{
    padding:24px 28px 40px;
    font-family:"IBM Plex Mono", monospace;
    font-size:0.7rem;
    color:var(--ink-soft);
    letter-spacing:0.03em;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important; scroll-behavior:auto !important;}
  }

  @media (max-width:820px){
    .sidebar{
      position:fixed;
      z-index:20;
      box-shadow:20px 0 40px rgba(0,0,0,0.35);
    }
    .sidebar[data-collapsed="true"]{transform:translateX(-100%); margin-left:0;}
    .sidebar[data-collapsed="false"]{transform:translateX(0);}
    .topbar{padding:14px 18px;}
    .hero{padding:6px 18px 26px;}
    .grid-wrap{padding:6px 18px 50px;}
  }
</style>
</head>
<body>
<div class="shell">

  <aside class="sidebar" id="sidebar" data-collapsed="true" aria-label="Guide index">
    <div class="sidebar-head">
      <div class="mark">The Library of Lessons</div>
      <div class="sub">Full index</div>
    </div>
    <div class="search-wrap">
      <input type="text" id="sidebarSearch" placeholder="Search guides…" aria-label="Search guides">
    </div>
    <ul class="sidebar-list" id="sidebarList">
      <li class="sidebar-empty">Loading index…</li>
    </ul>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="toggle-btn" id="sidebarToggle" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        Index
      </button>
      <span class="status-line" id="statusLine"></span>
    </div>

    <div class="hero">
      <div class="eyebrow">A living index</div>
      <h1>The Library of Lessons</h1>
      <p>Every guide here lives in its own repository and updates on its own schedule. This shelf simply reflects what's currently published — check back and it's already caught up.</p>
    </div>

    <div class="grid-wrap">
      <div class="card-grid" id="cardGrid">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </div>

    <footer id="footerNote"></footer>
  </div>

</div>

<script>
(function(){
  const USERNAME = "The-Library-Of-Lessons";
  const SELF_REPO = (USERNAME + ".github.io").toLowerCase();

  const cardGrid = document.getElementById('cardGrid');
  const sidebarList = document.getElementById('sidebarList');
  const statusLine = document.getElementById('statusLine');
  const footerNote = document.getElementById('footerNote');
  const sidebarSearch = document.getElementById('sidebarSearch');
  const sidebar = document.getElementById('sidebar');
  const sidebarToggle = document.getElementById('sidebarToggle');

  sidebarToggle.addEventListener('click', function(){
    const collapsed = sidebar.getAttribute('data-collapsed') === 'true';
    sidebar.setAttribute('data-collapsed', collapsed ? 'false' : 'true');
    sidebarToggle.setAttribute('aria-expanded', collapsed ? 'true' : 'false');
  });

  function titleCase(slug){
    return slug
      .replace(/[-_]+/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  function callNumber(index){
    // A quiet library-catalog flourish: LOL 001, LOL 002...
    return 'LOL ' + String(index + 1).padStart(3, '0');
  }

  function renderEmpty(message){
    cardGrid.innerHTML = '<div class="state-box"><div class="title">Nothing on the shelf yet</div><p>' + message + '</p></div>';
    sidebarList.innerHTML = '<li class="sidebar-empty">' + message + '</li>';
  }

  function renderError(){
    const msg = "Couldn't reach GitHub just now. Refresh the page to try again.";
    cardGrid.innerHTML = '<div class="state-box"><div class="title">The catalog is unreachable</div><p>' + msg + '</p></div>';
    sidebarList.innerHTML = '<li class="sidebar-empty">' + msg + '</li>';
    statusLine.textContent = 'connection failed';
  }

  function render(guides){
    if (guides.length === 0){
      renderEmpty('No public repositories with GitHub Pages enabled were found yet. Publish one, then reload.');
      return;
    }

    cardGrid.innerHTML = '';
    sidebarList.innerHTML = '';

    guides.forEach(function(g, i){
      const card = document.createElement('a');
      card.className = 'card';
      card.href = g.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.innerHTML =
        '<div class="spine"></div>' +
        '<div class="body">' +
          '<div class="call-no">' + callNumber(i) + '</div>' +
          '<h3>' + g.title + '</h3>' +
          '<p>' + g.description + '</p>' +
          '<span class="open">Open guide →</span>' +
        '</div>';
      cardGrid.appendChild(card);

      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = g.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = g.title;
      a.dataset.search = (g.title + ' ' + g.description).toLowerCase();
      li.appendChild(a);
      sidebarList.appendChild(li);
    });

    statusLine.textContent = guides.length + ' guide' + (guides.length === 1 ? '' : 's') + ' on the shelf';
    footerNote.textContent = 'Reflects public GitHub Pages repositories under ' + USERNAME + ' · refreshed live on each visit';
  }

  sidebarSearch.addEventListener('input', function(){
    const q = sidebarSearch.value.trim().toLowerCase();
    let visibleCount = 0;
    document.querySelectorAll('#sidebarList a').forEach(function(a){
      const match = !q || a.dataset.search.includes(q);
      a.parentElement.style.display = match ? '' : 'none';
      if (match) visibleCount++;
    });
    document.querySelectorAll('#cardGrid .card').forEach(function(card, i){
      const title = card.querySelector('h3').textContent.toLowerCase();
      const desc = card.querySelector('p').textContent.toLowerCase();
      const match = !q || title.includes(q) || desc.includes(q);
      card.style.display = match ? '' : 'none';
    });
  });

  async function loadGuides(){
    statusLine.textContent = 'reading the shelf…';
    try{
      const res = await fetch('https://api.github.com/users/' + USERNAME + '/repos?per_page=100&sort=updated', {
        headers: { 'Accept': 'application/vnd.github+json' }
      });
      if (!res.ok){
        if (res.status === 403){
          statusLine.textContent = 'rate limited — try again shortly';
          renderEmpty('GitHub asked us to slow down (rate limit). Reload in a few minutes.');
          return;
        }
        throw new Error('bad response');
      }
      const repos = await res.json();

      const guides = repos
        .filter(r => r.has_pages && !r.fork && r.name.toLowerCase() !== SELF_REPO)
        .map(function(r){
          return {
            title: titleCase(r.name),
            description: (r.description && r.description.trim()) ? r.description.trim() : titleCase(r.name),
            url: 'https://' + USERNAME.toLowerCase() + '.github.io/' + r.name + '/',
            updated: r.pushed_at
          };
        })
        .sort((a, b) => new Date(b.updated) - new Date(a.updated));

      render(guides);
    }catch(err){
      renderError();
    }
  }

  loadGuides();
})();
</script>
</body>
</html>
