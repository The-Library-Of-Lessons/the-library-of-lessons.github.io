<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <!-- Warm Lantern Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe8a3" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="pageGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ec"/>
      <stop offset="100%" stop-color="#e8dcbe"/>
    </linearGradient>
  </defs>

  <!-- Hanging Chain -->
  <line x1="200" y1="0" x2="200" y2="110" stroke="url(#brassGrad)" stroke-width="4" stroke-dasharray="6,4"/>
  <circle cx="200" cy="114" r="7" fill="none" stroke="url(#brassGrad)" stroke-width="3"/>

  <!-- Large Radial Ambient Glow -->
  <circle cx="200" cy="220" r="170" fill="url(#lanternGlow)"/>

  <!-- Lantern Top Cap -->
  <path d="M165 140 L200 118 L235 140 L225 152 L175 152 Z" fill="url(#brassGrad)"/>
  <rect x="175" y="152" width="50" height="8" rx="2" fill="#92400e"/>

  <!-- Lantern Glass Frame & Warm Core -->
  <rect x="170" y="160" width="60" height="90" rx="4" fill="#fef3c7" fill-opacity="0.25" stroke="url(#brassGrad)" stroke-width="3.5"/>
  <line x1="200" y1="160" x2="200" y2="250" stroke="url(#brassGrad)" stroke-width="2"/>
  
  <!-- Candle Flame Core -->
  <ellipse cx="200" cy="214" rx="7" ry="14" fill="#fff" opacity="0.95"/>
  <ellipse cx="200" cy="216" rx="12" ry="20" fill="#f59e0b" opacity="0.75"/>

  <!-- Lantern Bottom Base -->
  <path d="M165 250 L235 250 L225 268 L175 268 Z" fill="url(#brassGrad)"/>
  <circle cx="200" cy="274" r="5" fill="#78350f"/>
</svg>