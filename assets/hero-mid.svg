    <!-- Tree 4 Center-Right -->
    <path d="M1320 650 L1350 250 L1385 650 Z"/>
    <!-- Tree 5 Right -->
    <path d="M1610 650 L1640 180 L1680 650 Z"/>
    <!-- Tree 6 Far Right -->
    <path d="M1780 650 L1800 240 L1840 650 Z"/>

    <!-- Lush Foliage Boughs and Canopy Clouds -->
    <!-- Left Cluster -->
    <path d="M-20 340 C40 280, 100 290, 150 250 C210 210, 290 230, 340 180 C400 220, 470 200, 520 260 C580 290, 610 360, 600 420 C540 460, 480 430, 420 450 C360 480, 270 470, 220 510 C140 490, 60 520, -20 480 Z"/>
    
    <!-- Center Arch Canopy -->
