<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 650" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="forestMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--hero-forest-mid, #1f422e)"/>
      <stop offset="100%" stop-color="var(--hero-forest-deep, #0f2318)"/>
    </linearGradient>
    <linearGradient id="treeHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Stately Trunks Midground -->
  <g fill="url(#forestMid)">
    <!-- Tree 1 Left -->
    <path d="M120 650 L145 280 L135 240 L160 280 L180 650 Z"/>
    <!-- Tree 2 Left -->
    <path d="M280 650 L310 190 L340 650 Z"/>
    <!-- Tree 3 Center-Left -->
